# Keeps the pinned inputs current: action SHAs, base-image digests and uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
