[project]
name = "fuel-prices-mcp"
version = "0.1.0"
description = "UK fuel prices MCP server — official Fuel Finder open data (every UK forecourt, 30-minute freshness): cheapest petrol/diesel near a postcode, area price stats, station details"
authors = [{ name = "Dwain Barnes (EryriLabs)" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "fuel", "petrol", "diesel", "uk", "fuel-finder", "prices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
fuel-prices-mcp = "fuel_prices_mcp.server:main"

[project.urls]
Homepage = "https://github.com/dwain-barnes/fuel-prices-mcp"
HuggingFace = "https://huggingface.co/EryriLabs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_prices_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pydantic.Field"]

[tool.pytest.ini_options]
testpaths = ["tests"]
